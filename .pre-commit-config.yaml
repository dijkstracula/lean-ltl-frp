# Whitespace hygiene for the Lean sources.
#
# NOTE: Lean 4 has no canonical autoformatter (no `lake fmt`), so this only
# normalizes whitespace — it does NOT reflow Lean syntax. Activate with:
#   pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
